[package]
name = "ledger-db"
version = "0.1.0"
edition = "2024"

[dependencies]
ledger-core = { path = "../core" }
chrono = "0.4"
# The C library that sqlx bundles. The db crate registers SQL functions
# through its API; the version must stay the one that sqlx-sqlite uses.
libsqlite3-sys = "0.30"
serde = "1"
serde_json = "1"
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio", "sqlite", "chrono", "migrate", "macros"] }

[dev-dependencies]
tokio = { version = "1", features = ["full"] }
unicode-segmentation = "1"
