[package]
name = "ledger-db-derive"
version = "0.1.0"
edition = "2024"
# Not on crates.io. cargo-deny (deny.toml) treats a private crate as the
# workspace's own code: it needs no license field, and its path
# dependencies need no version.
publish = false

[lib]
proc-macro = true

[dependencies]
proc-macro2 = "1"
quote = "1"
syn = { version = "3", features = ["full"] }
