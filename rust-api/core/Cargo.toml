[package]
name = "ledger-core"
version = "0.1.0"
edition = "2024"

[lib]
crate-type = ["rlib", "cdylib"]

[features]
wasm = ["dep:wasm-bindgen"]

[dependencies]
chrono = { version = "0.4", default-features = false, features = ["alloc", "std", "serde"] }
icu_collator = "=2.3.1"
icu_locale = "=2.3.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
wasm-bindgen = { version = "=0.2.128", optional = true }
