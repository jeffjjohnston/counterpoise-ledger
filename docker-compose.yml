# Production stack only. Run from the production checkout on main
# (~/prod/counterpoise unless COUNTERPOISE_BUILD_DIR says otherwise).
# For development use docker compose -f docker-compose.dev.yml up -d --wait.
# Pins the Compose project name, which is otherwise taken from the directory
# this file sits in. Container names derive from it, so without this a clone
# named anything else — counterpoise-ledger, per the README's own clone
# command — produces counterpoise-ledger-rust-api-1, and every documented
# `docker exec counterpoise-rust-api-1 ...` in the README, CLAUDE.md and guides
# is wrong for the person following them.
#
# Still overridable by `-p` or COMPOSE_PROJECT_NAME for anyone running more
# than one instance from separate checkouts.
name: counterpoise

services:
  # The app: the UI, the API and MCP, on one port. Its entrypoint runs the
  # migrations and the lot rebuild before it starts the server
  # (docker-entrypoint.sh).
  rust-api:
    build:
      context: .
      args:
        # Put in the client at build time (vite.config.ts).
        NEXT_PUBLIC_POSTHOG_KEY: ${NEXT_PUBLIC_POSTHOG_KEY:-}
        NEXT_PUBLIC_POSTHOG_HOST: ${NEXT_PUBLIC_POSTHOG_HOST:-}
    ports:
      # Loopback by default so a reverse proxy (Tailscale Serve, Caddy, nginx)
      # is the only ingress. Publishing on 0.0.0.0 lets any LAN device reach the
      # app directly and bypass whatever authenticates that proxy.
      # Set APP_BIND=0.0.0.0 to expose it on the LAN deliberately. Host port
      # 3000 stays as it was before the Rust server took the web traffic, so a
      # reverse proxy needs no change.
      - "${APP_BIND:-127.0.0.1}:3000:4000"
    environment:
      NODE_ENV: production
      RUST_BIND: 0.0.0.0:4000
      TZ: ${TZ:-America/New_York}
      # Read when the server starts.
      ENABLE_HSTS: ${ENABLE_HSTS:-}
      # THE SAME VALUE AS THE PORT LINE ABOVE, so that the server knows where
      # the port is published. Inside the container it cannot see this.
      # With TRUST_PROXY unset, the server uses X-Forwarded-For for the rate
      # limits only when this is loopback: then a reverse proxy on this host is
      # the only client, and the proxy writes that header. On 0.0.0.0 a client
      # can connect directly and write any X-Forwarded-For value, so the server
      # uses the TCP peer address.
      APP_BIND: ${APP_BIND:-127.0.0.1}
      # true or false replaces the rule above. Set true only when every request
      # comes through a proxy that sets or appends X-Forwarded-For. See
      # the README, "Client addresses and rate limits".
      TRUST_PROXY: ${TRUST_PROXY:-}
    # REQUIRED, so Compose REFUSES when the file is absent instead of skipping
    # it in silence. That silence is how a deployment goes down: a
    # `docker compose up` run from a deleted worktree's directory still has its
    # pinned project name, so it addresses these containers anyway, finds no
    # .env.production.local to read, and starts the server with no
    # DATABASE_URL at all.
    #
    # THE ENTRYPOINT GUARD IS NOT A SUBSTITUTE FOR THIS, and neither replaces
    # the other. scripts/check-db-credential.sh runs from the entrypoint after
    # Compose has already recreated the container: it makes the failure
    # legible in seconds rather than minutes, but production is down by then
    # either way. This refusal stops the command before anything is
    # recreated, so the containers that were serving keep serving. One
    # prevents the outage, the other explains it.
    env_file:
      - path: .env.production.local
        required: true
    volumes:
      # Read-only: the Rust /api/system/status route reads the scheduler
      # status files to report job health. It never writes to backups.
      #
      # The override exists because the deploy runs Compose from a separate
      # build checkout, so `./backups` would resolve against THAT checkout —
      # relative bind sources follow the compose file, and the deploy's compose
      # file is the one in the build checkout. Docker CREATES a missing bind
      # source as an empty directory rather than failing, so the wrong path
      # does not error: the scheduler would write hourly dumps into a new
      # empty directory and this service would report job health against it.
      # The default keeps `docker compose` in this directory behaving exactly
      # as before; scripts/deploy.sh exports the absolute path.
      - ${COUNTERPOISE_BACKUPS_DIR:-./backups}:/backups:ro
    depends_on:
      postgres:
        condition: service_healthy
    # /health runs `select 1`, so this reports unhealthy when the pool is
    # broken rather than when the process is merely alive.
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:4000/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      # The entrypoint runs the credential check, the migrations and the lot
      # rebuild before the server starts. A short start_period marks the
      # container unhealthy during a normal boot.
      start_period: 90s
    restart: unless-stopped

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: counterpoise
      # THE BOOTSTRAP SUPERUSER, AND IT HAS NO FALLBACK ON PURPOSE. A default
      # here would have to be a value this repository publishes, and a
      # deployment must not take one. Nothing in this stack needs it either:
      # the app and the scheduler reach the database as counterpoise_app
      # through DATABASE_URL, and so does the hourly dump.
      #
      # Empty rather than `${POSTGRES_PASSWORD:?}` for the reason APP_DB_PASSWORD
      # gives below — a required variable breaks `ps`, `logs` and `down` too.
      # Empty is safe either way: an initialized volume ignores it, and the
      # postgres image refuses to initdb a fresh one without a password.
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-}
      POSTGRES_DB: counterpoise
      # Read by scripts/postgres-init/01-app-role.sh on first initialization.
      # Optional, not `${APP_DB_PASSWORD:?}`: Compose interpolates this whole
      # file before it selects services, so a required variable here would fail
      # every command that reads the file, `ps`, `logs` and `down` included.
      # The env_file below is required and does NOT reach those three — Compose
      # resolves an env_file for the services it starts. The app and the
      # scheduler enforce the credential itself — see
      # scripts/check-db-credential.sh.
      APP_DB_PASSWORD: ${APP_DB_PASSWORD:-}
      TZ: ${TZ:-America/New_York}
    volumes:
      - pgdata:/var/lib/postgresql/data
      # Runs on first initialization only. An existing pgdata volume skips it.
      - ./scripts/postgres-init:/docker-entrypoint-initdb.d:ro
      - ./scripts/postgres-entrypoint-guard.sh:/postgres-entrypoint-guard.sh:ro
    # BEFORE initdb, which is the only moment the published bootstrap password
    # can be refused without cost. Everything in /docker-entrypoint-initdb.d
    # runs AFTER the cluster exists, so a refusal there stops the container
    # with that password already stored and never fires again — see the script
    # for the full sequence.
    #
    # `sh <path>` rather than the path alone: Docker creates a missing bind
    # source as an empty DIRECTORY, and that must fail here rather than quietly
    # resolve to something else. The script ends in
    # `exec docker-entrypoint.sh postgres`, so postgres keeps PID 1.
    entrypoint: ["/bin/sh", "/postgres-entrypoint-guard.sh"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U counterpoise"]
      interval: 5s
      timeout: 3s
      retries: 5
    restart: unless-stopped

  scheduler:
    image: postgres:16-alpine
    environment:
      TZ: ${TZ:-America/New_York}
    # DATABASE_URL comes from the file below and has no default here. A default
    # would spell a connection string in a tracked file, and secret scanning refuses one —
    # correctly, because that is how a real password reaches a public mirror.
    # Required, for the reason given on rust-api above. Each container can be
    # recreated without a credential by the same mistake, and the hourly dump
    # this one writes would then land at 0 bytes.
    env_file:
      - path: .env.production.local
        required: true
    volumes:
      # Read-write, and the reason the override above exists: this is the
      # service that would silently write the hourly dumps somewhere nobody
      # looks. Same variable, same default, deliberately.
      - ${COUNTERPOISE_BACKUPS_DIR:-./backups}:/backups
      # Tracked, so a clean checkout of the deployed commit always holds it.
      - ./scripts/scheduler:/scheduler:ro
      # THE SAME GUARD THE APP ENTRYPOINT RUNS, mounted rather than copied.
      # This service runs the stock postgres image, so there is no build of
      # ours to copy the script into. Both containers carry DATABASE_URL and
      # both can be recreated without one; a guard in the app alone would
      # leave the hourly dump writing 0 bytes. The command below runs it
      # before it installs the crontab.
      - ./scripts/check-db-credential.sh:/check-db-credential.sh:ro
    entrypoint: /bin/sh
    command:
      - -c
      - |
        # BEFORE THE CRONTAB, AND WITH AN EXPLICIT EXIT. This runs under a
        # plain `sh -c` with no `set -e`, so a refusal that is not followed by
        # `exit 1` installs the crontab anyway and every job below runs with no
        # credential. `sh <path>` rather than the path alone: Docker creates a
        # missing bind source as an empty directory, and that must refuse here
        # rather than resolve to something else.
        sh /check-db-credential.sh || exit 1
        cat <<'CRONTAB' | crontab -
        # Process recurring transactions every hour
        0 * * * * { echo "[recurring] $$(date +\%F\ \%T)"; if wget -qO- --header="Authorization: Bearer $$CRON_SECRET" http://rust-api:4000/api/cron/recurring 2>&1; then /scheduler/record-status.sh recurring ok "HTTP 200"; else /scheduler/record-status.sh recurring fail "wget failed"; fi; } >> /proc/1/fd/1 2>&1
        # Sync Plaid transactions every 6 hours (12am, 6am, 12pm, 6pm)
        0 0,6,12,18 * * * { echo "[plaid-sync] $$(date +\%F\ \%T)"; if wget -qO- --header="Authorization: Bearer $$CRON_SECRET" http://rust-api:4000/api/cron/plaid-sync 2>&1; then /scheduler/record-status.sh plaid-sync ok "HTTP 200"; else /scheduler/record-status.sh plaid-sync fail "wget failed"; fi; } >> /proc/1/fd/1 2>&1
        # Fetch security prices early morning after each market day (Tue-Sat 6am ET)
        0 6 * * 2-6 { echo "[price-sync] $$(date +\%F\ \%T)"; if wget -qO- --header="Authorization: Bearer $$CRON_SECRET" http://rust-api:4000/api/cron/price-sync 2>&1; then /scheduler/record-status.sh price-sync ok "HTTP 200"; else /scheduler/record-status.sh price-sync fail "wget failed"; fi; } >> /proc/1/fd/1 2>&1
        # Expire detailed TypeSafe experiment records in bounded hourly batches
        15 * * * * wget -qO- --header="Authorization: Bearer $$CRON_SECRET" http://rust-api:4000/api/cron/typesafe-cleanup >> /proc/1/fd/1 2>&1
        # Hourly database backup, 6am–9pm (with lock to prevent overlap)
        0 6-21 * * * { echo "[backup] $$(date +\%F\ \%T)"; if mkdir /backups/.backup.lock 2>/dev/null; then trap 'rmdir /backups/.backup.lock' EXIT; F=/backups/counterpoise-$$(date +\%Y\%m\%d-\%H\%M\%S).dump; if pg_dump "$$DATABASE_URL" --format=custom --file="$$F" 2>&1; then if pg_restore --list "$$F" >/dev/null 2>&1; then /scheduler/record-status.sh backup ok "" "$$(wc -c < "$$F")" true; else /scheduler/record-status.sh backup ok "dump unreadable by pg_restore" "$$(wc -c < "$$F")" false; fi; else /scheduler/record-status.sh backup fail "pg_dump failed"; fi; else echo "[backup] skipped: lock held"; fi; } >> /proc/1/fd/1 2>&1
        # Prune backups older than 30 days, daily at 4am (shares lock with backup)
        0 4 * * * { echo "[backup-prune] $$(date +\%F\ \%T)"; if mkdir /backups/.backup.lock 2>/dev/null; then trap 'rmdir /backups/.backup.lock' EXIT; if find /backups -name "counterpoise-*.dump" -mtime +30 -delete 2>&1; then /scheduler/record-status.sh prune ok; else /scheduler/record-status.sh prune fail "find failed"; fi; else echo "[backup-prune] skipped: lock held"; fi; } >> /proc/1/fd/1 2>&1
        # Monthly REINDEX on the 1st at 3am
        0 3 1 * * { echo "[reindex] $$(date +\%F\ \%T)"; if reindexdb "$$DATABASE_URL" 2>&1; then /scheduler/record-status.sh reindex ok; else /scheduler/record-status.sh reindex fail "reindexdb failed"; fi; } >> /proc/1/fd/1 2>&1
        CRONTAB
        crond -f -l 2
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

volumes:
  pgdata:
    name: counterpoise_pgdata
    external: true
