[package]
name = "counterpoise-rust-api"
version = "0.1.0"
edition = "2024"
# Not on crates.io. cargo-deny (deny.toml) treats a private crate as the
# workspace's own code: it needs no license field, and its path
# dependencies need no version.
publish = false

[lib]
name = "counterpoise_rust_api"
path = "src/lib.rs"
# The doc comments hold no examples to run.
doctest = false

[[bin]]
name = "counterpoise-rust-api"
path = "src/main.rs"

[features]
default = ["native"]
# What only the native server has: the rusqlite backend and the file lock
# (ledger-db), the TCP listener and signals, the multi-threaded runtime,
# serving the client build from disk, the CIMD DNS pinning and the MCP stdio
# transport. The Workers build (wasm32) turns it off.
native = [
    "ledger-db/native",
    "tokio/full",
    "tower-http/fs",
    "dep:libc",
    "rmcp/transport-io",
    "axum/default",
    "axum/ws",
]

[dependencies]
ledger-core = { path = "../core" }
ledger-db = { path = "../db", default-features = false }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
# Without the `tokio` and `http1` defaults, which bring the TCP server and
# need tokio's `net`. `native` adds them, and `ws`: the book socket
# (routes/socket.rs), which a Durable Object serves with its own API.
axum = { version = "0.8", default-features = false, features = ["form", "json", "matched-path", "original-uri", "query", "tracing"] }
# The S256 PKCE digest of the OAuth token endpoint (oauth/token.rs).
base64 = "0.23"
chrono = "0.4"
futures-util = { version = "0.3", default-features = false, features = ["alloc"] }
hex = "0.4"
# The status-line reason phrase of a response, which `fetch` reports as `statusText`.
hyper = "1"
getrandom = "0.4"
iana-time-zone = "0.1"
libc = { version = "0.2", optional = true }
# The raw function only: the default `simple` API brings a random source
# that does not build for wasm32.
scrypt = { version = "0.12", default-features = false }
percent-encoding = "2"
# The asset-path and bearer-header patterns of the page gate (security.rs).
regex = "1"
serde = { version = "1", features = ["derive"] }
# Keep each number as written. JSON.parse reads a number beyond the double
# range as Infinity; without this feature serde_json refuses the whole body.
# Keep object keys in the order they were read, as a JavaScript object does,
# so that a JSON.stringify port writes the same text.
serde_json = { version = "1", features = ["arbitrary_precision", "preserve_order"] }
sha2 = "0.11"
# The signature of the S3 copy of the daily dump (scheduler/offsite.rs).
hmac = "0.13"
subtle = "2"
# What wasm32 supports. `native` adds the rest.
tokio = { version = "1", features = ["macros", "rt", "sync", "time"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
url = "2"
# The monotonic clock of platform.rs: std's Instant natively, performance.now()
# on wasm32, where std::time::Instant::now() panics.
web-time = "1"
unicode-segmentation = "1"
# The MCP model types, and natively the stdio transport. The HTTP transport
# is mcp/http.rs.
rmcp = { version = "3.4.1", features = ["server"] }
tower = { version = "0.5", features = ["util"] }
# Serves the client build (static_pages.rs) and compresses responses
# (compression.rs) with gzip or br. Each browser sends gzip, and br on HTTPS.
tower-http = { version = "0.7", features = ["compression-gzip", "compression-br"] }
jsonschema = { version = "0.60.2", default-features = false }
# The OpenAPI document model. The two features keep the component and path
# order that the source gives, so the committed file does not reorder.
utoipa = { version = "6.0.0", features = ["preserve_order", "preserve_path_order"] }
chacha20poly1305 = { version = "0.11", default-features = false, features = ["alloc"] }

# The random source of wasm32 is `crypto.getRandomValues`: getrandom 0.4
# (platform.rs), getrandom 0.3 (ahash, under jsonschema) and uuid (under
# rmcp) need it named.
[target.'cfg(target_arch = "wasm32")'.dependencies]
getrandom = { version = "0.4", features = ["wasm_js"] }
getrandom_03 = { package = "getrandom", version = "0.3", features = ["wasm_js"] }
uuid = { version = "1", features = ["js"] }
# `platform::outbound`: a `fetch` future as the `Send` future a handler is.
send_wrapper = { version = "0.6", features = ["futures"] }
# `platform`: the clock reads `Date.now()`, and spawn and sleep use the
# isolate's event loop and `setTimeout`.
chrono = { version = "0.4", features = ["wasmbind"] }
js-sys = "0.3"
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"

[dev-dependencies]
tokio = { version = "1", features = ["test-util"] }
# Decode the compressed bodies in the tests of compression.rs. tower-http
# uses these crates already, so they add nothing to the build.
brotli-decompressor = "6"
flate2 = "1"
# A local HTTPS server with a certificate made at test time, for the test that
# the outbound client refuses a certificate it does not trust (platform.rs).
# rustls and tokio-rustls are already in the tree through reqwest; ring is the
# provider reqwest uses.
rcgen = { version = "0.14", default-features = false, features = ["crypto", "pem", "ring"] }
rustls = { version = "0.23.46", default-features = false, features = ["ring", "std"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring"] }
