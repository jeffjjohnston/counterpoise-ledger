name: CI

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  secret-scan:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Install gitleaks
        env:
          GITLEAKS_VERSION: 8.30.1
        run: |
          curl -sSfL "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" \
            | sudo tar -xz -C /usr/local/bin gitleaks

      # Scans only the commits the PR adds, so pre-existing history findings
      # don't fail every future build. --redact keeps hits out of the CI log.
      - name: Scan for secrets
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          if [ -n "$BASE_SHA" ]; then
            gitleaks git . --log-opts="$BASE_SHA..$HEAD_SHA" -c .gitleaks.toml -v --redact
          else
            gitleaks dir . -c .gitleaks.toml -v --redact
          fi

  lint-typecheck:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Lint
        run: npm run lint

      - name: Type check
        run: npx tsc --noEmit

  # Runs the production build path with NO database service, deliberately.
  #
  # The e2e job also builds, but with --webpack and against a live Postgres, so
  # it proves neither that Turbopack succeeds nor that the build works without a
  # database. A page that queries the database at build time passes there and
  # fails in `docker build`, which is how v1.14.2 reached a deploy with a broken
  # image: /login had become an async server component reading the users table.
  #
  # No `services:` block here is the point of the job, not an omission.
  production-build:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Build (Turbopack, no database)
        run: npm run build

  unit-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: counterpoise
          POSTGRES_PASSWORD: counterpoise
          POSTGRES_DB: counterpoise
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U counterpoise"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 5

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      # Part of the suite shells out to a script that fails closed when its
      # secret scanner is absent. Without gitleaks here, that guardrail fires
      # for the wrong reason and the test passes dishonestly.
      - name: Install gitleaks
        env:
          GITLEAKS_VERSION: 8.30.1
        run: |
          curl -sSfL "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" \
            | sudo tar -xz -C /usr/local/bin gitleaks

      - run: npm ci

      - name: Create test databases
        run: npm run db:create-test-dbs
        env:
          DATABASE_URL: postgresql://counterpoise:counterpoise@localhost:5432/counterpoise

      - name: Run unit and integration tests with coverage
        run: npm run test:coverage

  e2e-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: counterpoise
          POSTGRES_PASSWORD: counterpoise
          POSTGRES_DB: counterpoise
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U counterpoise"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 5

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Cache Playwright browsers
        uses: actions/cache@v5
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ hashFiles('package-lock.json') }}

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - name: Create test databases
        run: npm run db:create-test-dbs
        env:
          DATABASE_URL: postgresql://counterpoise:counterpoise@localhost:5432/counterpoise

      - name: Run E2E tests
        run: npm run test:e2e
