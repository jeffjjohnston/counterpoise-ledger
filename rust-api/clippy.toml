# Every transaction opens through `ledger_db::Database`, so that the engine
# decides how a write transaction starts (`BEGIN IMMEDIATE`).
disallowed-methods = [
  { path = "rusqlite::Connection::transaction", reason = "use ledger_db::Database::transaction (BEGIN IMMEDIATE)" },
  { path = "rusqlite::Connection::unchecked_transaction", reason = "use ledger_db::Database::transaction (BEGIN IMMEDIATE)" },
]
