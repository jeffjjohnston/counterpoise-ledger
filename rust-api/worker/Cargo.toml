[package]
name = "counterpoise-worker"
version = "0.1.0"
edition = "2024"
publish = false

# The Cloudflare target: the Worker and its Durable Object, built with
# `worker-build` for wasm32. On a native build the crate holds only the
# routing rules, so the workspace's native checks and tests cover them.
[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
counterpoise-rust-api = { path = "../server", default-features = false }
http = "1"

[target.'cfg(target_arch = "wasm32")'.dependencies]
# `http` converts a request into an `http::Request` for the router and its
# response back.
worker = { version = "=0.8.7", features = ["http"] }
# `#[durable_object]` expands to code that names this crate; `storage.rs`
# binds what workers-rs does not.
wasm-bindgen = "0.2"
js-sys = "0.3"
# The promise of a dump's write into the export bucket.
wasm-bindgen-futures = "0.4"
ledger-db = { path = "../db", default-features = false }
tower-service = "0.3"
serde_json = "1"
# The time of the next alarm.
chrono = { version = "0.4", default-features = false, features = ["clock", "wasmbind"] }
