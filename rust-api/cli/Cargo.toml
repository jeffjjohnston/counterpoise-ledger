[package]
name = "ledger-cli"
version = "0.1.0"
edition = "2024"
# Not on crates.io. cargo-deny (deny.toml) treats a private crate as the
# workspace's own code: it needs no license field, and its path
# dependencies need no version.
publish = false

[dependencies]
ledger-core = { path = "../core" }
ledger-db = { path = "../db" }
chrono = "0.4"
getrandom = "0.4"
hex = "0.4"
scrypt = "0.12"
serde_json = "1"
