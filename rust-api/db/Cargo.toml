[package]
name = "ledger-db"
version = "0.1.0"
edition = "2024"

[dependencies]
ledger-core = { path = "../core" }
chrono = "0.4"
serde_json = "1"
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio", "tls-rustls", "postgres", "chrono"] }

[dev-dependencies]
tokio = { version = "1", features = ["full"] }
