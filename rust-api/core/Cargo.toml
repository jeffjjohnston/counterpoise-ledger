[package]
name = "ledger-core"
version = "0.1.0"
edition = "2024"
# Not on crates.io. cargo-deny (deny.toml) treats a private crate as the
# workspace's own code: it needs no license field, and its path
# dependencies need no version.
publish = false

[lib]
crate-type = ["rlib", "cdylib"]

[features]
wasm = ["dep:wasm-bindgen"]

[dependencies]
chrono = { version = "0.4", default-features = false, features = ["alloc", "std", "serde"] }
icu_collator = "=2.3.1"
icu_locale = "=2.3.1"
pulldown-cmark = { version = "0.13", default-features = false, features = ["html"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
wasm-bindgen = { version = "=0.2.130", optional = true }
